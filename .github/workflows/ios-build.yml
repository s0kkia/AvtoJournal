name: iOS build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  simulator:
    name: Build (simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AvtoJournal.xcodeproj \
            -scheme AvtoJournal \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        run: |
          mkdir -p artifacts
          cp -R build/Build/Products/Debug-iphonesimulator/AvtoJournal.app artifacts/
          cd artifacts
          zip -r AvtoJournal-ios-simulator.zip AvtoJournal.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvtoJournal-ios-simulator
          path: ios/artifacts/AvtoJournal-ios-simulator.zip
          if-no-files-found: error

  unsigned-ipa:
    name: Build (unsigned .ipa)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AvtoJournal.xcodeproj \
            -scheme AvtoJournal \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/AvtoJournal.app Payload/
          zip -qry AvtoJournal-unsigned.ipa Payload
          shasum -a 256 AvtoJournal-unsigned.ipa | tee AvtoJournal-unsigned.ipa.sha256

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvtoJournal-unsigned-ipa
          path: |
            ios/AvtoJournal-unsigned.ipa
            ios/AvtoJournal-unsigned.ipa.sha256
          if-no-files-found: error
