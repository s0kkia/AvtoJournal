name: AvtoJournal
options:
  bundleIdPrefix: ru.freedgi
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  AvtoJournal:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AvtoJournal
        excludes:
          - "Web"
      - path: AvtoJournal/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.freedgi.autojournal
        MARKETING_VERSION: "2.5"
        CURRENT_PROJECT_VERSION: "16"
        INFOPLIST_FILE: AvtoJournal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  AvtoJournal:
    build:
      targets:
        AvtoJournal: all
    run:
      config: Debug
    archive:
      config: Release
